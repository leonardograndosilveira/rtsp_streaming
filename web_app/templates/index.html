<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS_CENTER // SURVEILLANCE_HUB</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="ops-container">
        <!-- HEADER -->
        <header>
            <div class="brand">
                <span>ALLVISION</span>
                <span style="color: var(--neon-green); font-size: 0.8em;">// V.2.0</span>
            </div>
            <div class="system-status">
                <span>CPU: <span id="cpu-load">12%</span></span>
                <span>MEM: <span id="mem-load">4.2GB</span></span>
                <span>NET: <span style="color: var(--neon-amber);">STABLE</span></span>
                <span id="clock">00:00:00</span>
            </div>
        </header>

        <!-- SIDEBAR CONTROLS -->
        <aside>
            <div class="control-group">
                <div class="control-label">Source Select</div>
                <select id="source-type">
                    <option value="camera">LIVE FEED (CAMERA)</option>
                    <option value="file">ARCHIVE (FILE)</option>
                    <option value="network">EXTERNAL (NETWORK)</option>
                </select>
            </div>

            <div id="camera-controls" class="control-group">
                <div class="control-label">Camera Index</div>
                <select id="camera-select">
                    <option value="" disabled selected>SCANNING...</option>
                </select>
                <button id="refresh-cameras" class="btn">REFRESH DEVICES</button>
            </div>

            <div id="file-controls" class="control-group hidden">
                <div class="control-label">File Upload</div>
                <div class="file-upload-wrapper">
                    <input type="file" id="file-input" accept="video/*">
                </div>
                <button id="upload-btn" class="btn">UPLOAD ARCHIVE</button>
                <div class="control-label" style="margin-top: 10px;">Select File</div>
                <select id="file-select">
                    <option value="" disabled selected>NO MEDIA</option>
                </select>
            </div>

            <div id="network-controls" class="control-group hidden">
                <div class="control-label">Source URL (Pull)</div>
                <input type="text" id="network-url" placeholder="rtsp://user:pass@ip:port/path">
            </div>

            <div class="control-group">
                <div class="control-label">RTSP Output</div>
                <input type="number" id="rtsp-port" value="8554" min="1" max="65535" placeholder="Port (8554)">
                <input type="text" id="rtsp-mount" value="/stream" placeholder="Mount (/stream)" style="margin-top: 8px;">
                <div class="control-label" style="margin-top: 8px; font-size: 0.7em; color: var(--neon-green);">PUBLISH: <span id="rtsp-preview">rtsp://localhost:8554/stream</span></div>
            </div>

            <div class="control-group" style="margin-top: auto;">
                <div class="control-label">Stream Control</div>
                <button id="add-btn" class="btn btn-primary">ADD STREAM</button>
                <button id="stop-all-btn" class="btn btn-danger" style="margin-top: 10px;">TERMINATE ALL</button>
            </div>
        </aside>

        <!-- MAIN VIEWPORT: grid of concurrent stream cards -->
        <main id="viewport">
            <div class="scan-line-anim"></div>

            <div id="empty-placeholder" class="video-feed-placeholder">
                <div style="font-size: 64px; color: var(--panel-border); margin-bottom: 20px;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9Z"/>
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 2v2"/>
                        <path d="M12 20v2"/>
                        <path d="M2 12h2"/>
                        <path d="M20 12h2"/>
                    </svg>
                </div>
                <h2 style="color: var(--text-dim); letter-spacing: 2px;">NO ACTIVE STREAMS</h2>
                <div style="font-size: 12px; color: var(--panel-border);">[ADD A SOURCE TO BEGIN]</div>
            </div>

            <div id="stream-grid" class="stream-grid"></div>
        </main>

        <!-- FOOTER / STATUS -->
        <footer>
            <div style="display: flex; align-items: center;">
                <span id="status-dot" class="status-indicator standby"></span>
                <span id="status-text" class="console-log">SYSTEM STANDBY</span>
            </div>
            <div class="console-log" id="stream-count-display">0 STREAMS ACTIVE</div>
        </footer>
    </div>

    <!-- Cloned per active stream by app.js -->
    <template id="stream-card-template">
        <div class="stream-card">
            <div class="card-preview">
                <img class="card-frame" alt="Live RTSP preview frame">
                <div class="card-liveness liveness-pending">
                    <span class="status-indicator standby"></span>
                    <span class="card-liveness-text">VERIFYING...</span>
                </div>
                <div class="card-stats hidden">
                    <div>RES <span class="stat-res">N/A</span></div>
                    <div>CDC <span class="stat-codec">N/A</span></div>
                    <div>BTR <span class="stat-bitrate">N/A</span></div>
                </div>
            </div>
            <div class="card-meta">
                <span class="card-title">/stream</span>
                <span class="card-port">:0000</span>
            </div>
            <div class="card-url console-log">rtsp://...</div>
            <div class="card-actions">
                <button class="btn card-test">TEST</button>
                <button class="btn btn-danger card-stop">STOP</button>
            </div>
        </div>
    </template>

    <script src="/static/js/stream_card.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
